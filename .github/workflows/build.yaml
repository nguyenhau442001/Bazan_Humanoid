name: Build & Test

on:
  push:
    branches: [jazzy, main]
  pull_request:
    branches: [jazzy, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 / ROS2 Jazzy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      # ros-tooling/setup-ros looks up the ros-apt-source release with an anonymous GitHub API call; when that
      # call is rate limited the version comes back empty and the download 404s. Same official steps, with a token.
      - name: Set up ROS 2 Jazzy (apt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          sudo apt-get update && sudo apt-get install -y curl jq
          ver=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | jq -r .tag_name)
          codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")
          curl -fL --retry 3 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ver}/ros2-apt-source_${ver}.${codename}_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools

      - name: Install dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths software/ros2/src --ignore-src --rosdistro jazzy -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure

      - name: Test results
        if: always()
        run: colcon test-result --verbose || true
